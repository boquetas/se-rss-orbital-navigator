[RSSNAV]
SourceBody=Luburn
TargetBody=Tropol
Surface=0
; Dashboard default/maximum is 0.55; smaller cockpit surfaces may need 0.35-0.45.
FontSize=0.55
DisplayMode=Dashboard
PredictionHours=48
ModelEpoch=2081-01-01T00:00:00
TimeOffsetSeconds=0

; Jump Drive range from the LCD's construct.
JumpRangeMode=Auto
JumpIdentityId=0

; Departure/arrival geometry.
SourceRadiusMode=Auto
SourceDepartureRadiusKm=0
TargetArrivalMode=OrbitZone
TargetArrivalRadiusKm=0
TargetSafetyMarginKm=25

; LCD alert colors.
ColorAlertsEnabled=true
AlertLeadMinutes=30
NormalColor=255,255,255
SoonColor=255,220,64
OpenColor=64,255,96
ClosingColor=255,160,32
ErrorColor=255,64,64

; Sound Block alert.
SoundAlertEnabled=true
SoundBlockTag=[RSSNAV ALERT]
SoundCooldownSeconds=300
SoundOnStartup=false
SoundRequireApiValid=true

ShowDiagnostics=false
Title=RSS ORBITAL NAVIGATOR

; Optional physical Button Panel controls. Use one panel per action:
; [RSSNAV SRC NEXT], [RSSNAV SRC PREV], [RSSNAV DST NEXT],
; [RSSNAV DST PREV], or [RSSNAV RESET].
; A single four-button panel can instead be named [RSSNAV MULTI].

name: Finalize source upload

on:
  push:
    branches:
      - develop
    paths:
      - '.bootstrap/**'
      - '.github/workflows/finalize-source.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/source.b64.part00
          mkdir -p Data/Scripts/RSSOrbitalNavigator
          cat .bootstrap/source.b64.part* | base64 --decode > Data/Scripts/RSSOrbitalNavigator/RssOrbitalNavigatorSession.cs
          echo '7f6d30ceac8dc7b3174989e17e39aa4b536c785d10bda9790bef27db3064171f  Data/Scripts/RSSOrbitalNavigator/RssOrbitalNavigatorSession.cs' | sha256sum --check
          rm -rf .bootstrap
          rm -f .github/workflows/finalize-source.yml

      - name: Commit completed source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat: add RSS Orbital Navigator 0.4.0 source'
          git push origin HEAD:develop
